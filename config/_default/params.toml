# Pages placed under these sections will be shown on homepage and archive page.
mainSections = ["post"]
# Output page's full content in RSS.
rssFullContent = true
favicon        = "img/favicon-head.svg"

# Accepted values: "default", "lastmod"
# default = see https://gohugo.io/quick-reference/glossary/#default-sort-order
# lastmod = sort by last modified date, in descending order
SortBy              = "default"

[footer]
    since      = 2026
    customText = "建设中……"

[dateFormat]
    published   = "2006-01-02 Mon"
    lastUpdated = "2006-01-02 Mon"

[sidebar]
    emoji    = "🌥️"
    subtitle = "为什么做了这个博客呢"
    avatar   = "img/head.png"

[article]
    headingAnchor = false
    math          = false
    readingTime   = true

    [article.license]
        enabled = true
        default = "Licensed under CC BY-NC-SA 4.0"

[widgets]
    homepage = [
        { type = "search" },
        { type = "archives", params = { limit = 5 } },
        { type = "categories", params = { limit = 10 } },
    ]
    page = [{ type = "toc" }]

[opengraph.twitter]
    site = ""
    card = "summary_large_image"

[colorScheme]
    toggle  = true
    default = "auto"

## Comments
[comments]
    enabled  = true
    provider = "giscus"

    [comments.giscus]
        repo             = "DoL1ME/dol1me-blog"
        repoID           = "R_kgDOSnEk9g"
        category         = "General"
        categoryID       = "DIC_kwDOSnEk9s4C9z_f"
        mapping          = "pathname"
        lightTheme       = "light"
        darkTheme        = "dark_dimmed"
        reactionsEnabled = true
        emitMetadata     = false
        inputPosition    = "top"
        lang             = "zh"
        strict           = false
        loading          = "lazy"

    # See all the available configurations at https://github.com/CaiJimmy/hugo-theme-stack/blob/master/config/_default/params.toml
    # Copy the configurations you need from there and paste it here.
